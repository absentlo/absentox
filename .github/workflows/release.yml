name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # shortcut: the Linux plugins need this Ubuntu's glibc or newer; build on an older system if users report load errors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 libdbus-1-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev
      - run: ./package.sh
      - name: Check that all four downloads exist
        run: |
          for f in ABSENToX-Linux.tar.gz ABSENToX-Windows.zip ABSENToX-VST3-CLAP-Linux.tar.gz ABSENToX-VST3-CLAP-Windows.zip; do
            test -s "dist/$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ABSENToX-downloads
          path: dist/
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
